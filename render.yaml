databases:
  - name: recliq-db
    databaseName: recliq
    user: recliq
    plan: free

services:
  - type: web
    name: recliq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    healthCheckPath: /health

    # Note: Persistent disk requires a paid plan.
    # Free tier uses ephemeral /tmp storage — files are lost on restart.

    envVars:
      # Pin Python 3.12 so Render doesn't use 3.14 (no pandas wheel available).
      - key: PYTHON_VERSION
        value: "3.12.10"

      # Render injects the PostgreSQL connection string (postgresql://...).
      # start.sh converts it to the psycopg3 scheme (postgresql+psycopg://).
      - key: RENDER_DB_URL
        fromDatabase:
          name: recliq-db
          property: connectionString

      - key: LOCAL_STORAGE_PATH
        value: /tmp/storage

      - key: STORAGE_BACKEND
        value: local

      - key: ENVIRONMENT
        value: production

      - key: SESSION_COOKIE_SECURE
        value: "true"

      # Account cookies and CSRF protection. This is generated by Render;
      # never reuse it across environments or commit its value.
      - key: AUTH_CSRF_SECRET
        generateValue: true
      # Encrypts two-factor keys in the database; generated by Render. Losing
      # it means stored two-factor keys can no longer be read.
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_SESSION_DAYS
        value: "30"

      # Registration and report email remain off until a real mail transport
      # and administrator credentials have been entered in the Render dashboard.
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: EMAIL_BACKEND
        value: disabled
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: RecliQ
      - key: SMTP_STARTTLS
        value: "true"
      # Set this to the deployed frontend's public HTTPS URL, not the API URL.
      # Production startup rejects localhost to prevent unusable account links.
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_TOTP_SECRET
        sync: false

      - key: API_PREFIX
        value: /api

      # Set these in the Render dashboard AFTER your Vercel URL is known:
      #   FRONTEND_ORIGIN    = https://your-app.vercel.app
      #   EXTRA_CORS_ORIGINS = https://your-app.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      - key: EXTRA_CORS_ORIGINS
        sync: false
