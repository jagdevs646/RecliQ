<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087d72" />
    <title>RecliQ - One click reconciliation</title>
    <!-- Page colour before the app loads, so there is no white flash. -->
    <script>
      try {
        const mode = localStorage.getItem("recliq_theme") || "system";
        const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* Theme preference is optional. */ }
    </script>
    <style>
      html, body { margin: 0; background: #f4f7f7; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #101719; color: #edf4f3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
