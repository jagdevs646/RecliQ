services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recliq
      POSTGRES_PASSWORD: recliq
      POSTGRES_DB: recliq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recliq -d recliq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://recliq:recliq@postgres:5432/recliq
      FRONTEND_ORIGIN: http://localhost:5173
      LOCAL_STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - backend-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-storage:
