name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scan the whole history, not only the latest commit.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recliq
          POSTGRES_PASSWORD: recliq
          POSTGRES_DB: recliq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recliq -d recliq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/backend -q
      - name: Migrate PostgreSQL and verify the audit log is append-only
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://recliq:recliq@localhost:5432/recliq
        run: |
          alembic upgrade head
          python ../scripts/ci_check_audit_append_only.py
          alembic downgrade 20260801_0001
          alembic upgrade head

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level moderate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build --file docker/backend.Dockerfile --tag recliq-backend:ci backend
      - name: Frontend image
        run: docker build --file docker/frontend.Dockerfile --tag recliq-frontend:ci frontend
      - name: Azure images
        run: |
          docker build --file docker/backend.azure.Dockerfile --tag recliq-backend-azure:ci .
          docker build --file docker/frontend.azure.Dockerfile --tag recliq-frontend-azure:ci .
